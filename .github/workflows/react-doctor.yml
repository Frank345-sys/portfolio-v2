name: React Doctor

on:
  pull_request:
    branches: ['main', 'develop']

concurrency:
  group: react-doctor-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run React Doctor (diff vs base branch)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "${BASE_REF}"
          npm exec react-doctor -- . --verbose -y --diff "origin/${BASE_REF}" --pr-comment > react-doctor-report.txt 2>&1 || true

      - name: Comment PR with report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('react-doctor-report.txt', 'utf8');
            const truncated = report.length > 60000
              ? report.substring(0, 60000) + '\n\n... (reporte truncado por longitud)'
              : report;
            const baseRef = process.env.BASE_REF ?? 'main';
            const body = [
              '## 🩺 React Doctor Report',
              '',
              `Modo **diff** frente a \`origin/${baseRef}\` (solo archivos del PR; evita falsos positivos de código muerto en todo el repo).`,
              '',
              '<details>',
              '<summary>Ver diagnóstico completo</summary>',
              '',
              '```',
              truncated,
              '```',
              '</details>',
              '',
              '> Generado automáticamente en cada PR hacia `main` o `develop`. Auditoría completa local: `npm run react-doctor:full`.',
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
