name: Release

# Publica una GitHub Release al crear/pushear un tag semver con prefijo v (p. ej. v1.1.0).
# El cuerpo se toma de CHANGELOG.md: bloque "## [X.Y.Z]" que coincida con el tag (sin la v).

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extraer notas desde CHANGELOG.md
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          export VERSION
          python3 << 'PY'
          import os
          import re

          tag = os.environ["TAG_NAME"]
          version = os.environ["VERSION"]
          with open("CHANGELOG.md", encoding="utf-8") as f:
              text = f.read()
          m = re.search(
              rf"^(## \[{re.escape(version)}\][\s\S]*?)(?=^## \[|\Z)",
              text,
              re.MULTILINE,
          )
          if m:
              body = m.group(1).rstrip() + "\n"
          else:
              body = (
                  f"## {tag}\n\n"
                  f"No se encontró la sección `## [{version}]` en `CHANGELOG.md`. "
                  "Añádela antes del próximo tag o edita la release a mano en GitHub.\n"
              )
          with open("release_body.md", "w", encoding="utf-8") as f:
              f.write(body)
          PY

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_body.md
          draft: false
          prerelease: false
          make_latest: true
