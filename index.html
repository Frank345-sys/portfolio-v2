<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Barra de direcciones / PWA: contenido actualizado en cliente vía ThemeProvider -->
    <meta name="theme-color" content="#ffffff" id="meta-theme-color" />
    <!-- Anti-FOUC: alinear con THEME_STORAGE_KEY y THEME_COLOR_HEX en src/shared/constants/theme.ts -->
    <script>
      ;(function () {
        var key = 'theme'
        var colors = { light: '#ffffff', dark: '#171717' }
        var stored = localStorage.getItem(key)
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        var root = document.documentElement
        if (dark) root.classList.add('dark')
        var meta = document.getElementById('meta-theme-color')
        if (meta)
          meta.setAttribute('content', dark ? colors.dark : colors.light)
      })()
    </script>

    <!-- code icon -->
    <link rel="icon" type="image/svg+xml" href="/code-icon.svg" />

    <!-- Primary SEO (sustituido en build desde shared/constants/siteProfile) -->
    <title>@@SITE_PAGE_TITLE@@</title>
    <meta name="description" content="@@SITE_META_DESCRIPTION@@" />
    <meta name="author" content="@@SITE_DISPLAY_NAME@@" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%VITE_PUBLIC_SITE_URL%/" />

    <!-- Open Graph (LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_PUBLIC_SITE_URL%/" />
    <meta property="og:title" content="@@SITE_PAGE_TITLE@@" />
    <meta property="og:description" content="@@SITE_META_DESCRIPTION_SHORT@@" />
    <meta property="og:image" content="%VITE_PUBLIC_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:site_name" content="@@SITE_DISPLAY_NAME@@" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="%VITE_PUBLIC_SITE_URL%/" />
    <meta name="twitter:title" content="@@SITE_PAGE_TITLE@@" />
    <meta
      name="twitter:description"
      content="@@SITE_META_DESCRIPTION_SHORT@@"
    />
    <meta name="twitter:image" content="%VITE_PUBLIC_SITE_URL%/og-image.png" />

    <!-- JSON-LD: Structured Data para Google -->
    <script type="application/ld+json">
      @@SITE_JSONLD@@
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
